airstats:
  outputs:
    dev:
      type: duckdb
      path: "airstats.duckdb"
      schema: "dbt_{{ env_var('DBT_ENV_NAME') | lower | trim }}_dev"
      threads: 4

    staging:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"

      role: TRANSFORM
      private_key: "{{ env_var('PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('PRIVATE_KEY_PASSPHRASE') }}"

      database: AIRBNB
      schema: STAGING
      threads: 4
      warehouse: COMPUTE_WH

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"

      role: TRANSFORM
      private_key: "{{ env_var('PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('PRIVATE_KEY_PASSPHRASE') }}"

      database: AIRBNB
      schema: PROD
      threads: 4
      warehouse: COMPUTE_WH

  target: dev
