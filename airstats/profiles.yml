airstats:
  outputs:
    silver:
      type: duckdb
      path: "airstats.duckdb"
      schema: "silver"
      threads: 4

    bronze:
      type: duckdb
      path: "airstats.duckdb"
      schema: "bronze"
      threads: 4

    dev:
      type: duckdb
      path: "airstats.duckdb"
      schema: "dbt_{{ env_var('DBT_ENV_NAME') | lower | trim }}_dev"
      threads: 4

  target: dev
